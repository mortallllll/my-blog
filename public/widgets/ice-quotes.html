<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>冰语流光 · 励志语录</title>
    <style>
      :root {
        --ice-blue-1: #c8e6f5;
        --ice-blue-2: #a8d8ea;
        --ice-blue-3: #7ec8e3;
        --ice-deep: #3a5f8a;
        --sun-gold: #f9d56e;
        --sun-warm: #f8c255;
        --glass-bg: rgba(255, 255, 255, 0.08);
        --glass-border: rgba(255, 255, 255, 0.18);
        --text-primary: #e8f0f8;
        --text-secondary: #b8cce0;
        --accent: #f0c060;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        font-family:
          "Georgia", "Noto Serif SC", "STSong", "SimSun", "Songti SC", serif;
        background: #0a1628;
        user-select: none;
        -webkit-font-smoothing: antialiased;
      }

      /* ── 背景层容器 ── */
      .bg-stage {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
      }

      /* 天空底 */
      .sky {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          175deg,
          #5b8cbf 0%,
          /* 顶部天蓝 */ #7aabd4 8%,
          #b8d4e8 20%,
          /* 阳光漫射区 */ #e8dcc8 32%,
          /* 暖光带 */ #d4c8a8 38%,
          #a8c8d8 50%,
          /* 冰蓝中段 */ #6a9ab8 70%,
          #3a6a8a 90%,
          #1a3a55 100%
        );
      }

      /* ── 冰层 (7层堆叠) ── */
      .ice-sheet {
        position: absolute;
        border-radius: 2px;
        transform-origin: center center;
      }

      /* 底层 — 深厚冰盖 */
      .ice-sheet.deep {
        width: 110%;
        height: 45%;
        left: -5%;
        bottom: -10%;
        background: linear-gradient(
          0deg,
          rgba(30, 70, 110, 0.75) 0%,
          rgba(50, 100, 150, 0.55) 30%,
          rgba(80, 140, 190, 0.35) 60%,
          rgba(120, 170, 210, 0.15) 100%
        );
        filter: blur(6px);
        animation: iceDrift1 28s ease-in-out infinite;
        box-shadow:
          0 -20px 80px rgba(180, 210, 240, 0.15) inset,
          0 4px 30px rgba(0, 0, 0, 0.2);
      }

      /* 中层A — 半透冰晶 */
      .ice-sheet.mid-a {
        width: 105%;
        height: 28%;
        left: -3%;
        bottom: 5%;
        background: linear-gradient(
          175deg,
          rgba(180, 215, 240, 0.3) 0%,
          rgba(200, 225, 245, 0.2) 40%,
          rgba(160, 200, 230, 0.35) 70%,
          rgba(130, 175, 210, 0.25) 100%
        );
        filter: blur(3px);
        animation: iceDrift2 22s ease-in-out infinite;
        box-shadow:
          0 -10px 50px rgba(200, 225, 245, 0.12) inset,
          0 2px 20px rgba(0, 0, 0, 0.15);
      }

      /* 中层B — 霜花纹 */
      .ice-sheet.mid-b {
        width: 108%;
        height: 22%;
        left: -4%;
        bottom: 15%;
        background: linear-gradient(
          5deg,
          rgba(210, 230, 248, 0.28) 0%,
          rgba(190, 220, 245, 0.18) 25%,
          rgba(220, 235, 250, 0.32) 50%,
          rgba(180, 210, 240, 0.2) 75%,
          rgba(200, 225, 248, 0.15) 100%
        );
        filter: blur(4px);
        animation: iceDrift3 20s ease-in-out infinite;
        box-shadow: 0 -8px 40px rgba(210, 230, 250, 0.1) inset;
      }

      /* 上层A — 薄冰 */
      .ice-sheet.top-a {
        width: 102%;
        height: 18%;
        left: -1%;
        bottom: 25%;
        background: linear-gradient(
          178deg,
          rgba(225, 240, 252, 0.22) 0%,
          rgba(240, 248, 255, 0.28) 30%,
          rgba(210, 235, 250, 0.18) 60%,
          rgba(190, 220, 245, 0.24) 100%
        );
        filter: blur(2px);
        animation: iceDrift4 18s ease-in-out infinite;
        box-shadow:
          0 -6px 30px rgba(230, 240, 250, 0.14) inset,
          0 1px 10px rgba(255, 255, 255, 0.08);
        border-top: 1px solid rgba(255, 255, 255, 0.12);
      }

      /* 上层B — 冰面反光 */
      .ice-sheet.top-b {
        width: 104%;
        height: 12%;
        left: -2%;
        bottom: 32%;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.12) 0%,
          rgba(240, 248, 255, 0.25) 40%,
          rgba(200, 230, 248, 0.1) 100%
        );
        filter: blur(1.5px);
        animation: iceDrift5 15s ease-in-out infinite;
        border-top: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 0 40px rgba(255, 255, 240, 0.1) inset;
      }

      /* 最上层 — 冰霜纹理覆盖 */
      .ice-sheet.frost {
        width: 100%;
        height: 100%;
        left: 0;
        top: 0;
        background:
          radial-gradient(
            ellipse at 15% 30%,
            rgba(255, 255, 255, 0.06) 0%,
            transparent 60%
          ),
          radial-gradient(
            ellipse at 75% 20%,
            rgba(255, 255, 255, 0.05) 0%,
            transparent 55%
          ),
          radial-gradient(
            ellipse at 50% 55%,
            rgba(200, 220, 240, 0.07) 0%,
            transparent 50%
          ),
          radial-gradient(
            ellipse at 30% 70%,
            rgba(180, 200, 230, 0.06) 0%,
            transparent 45%
          );
        pointer-events: none;
        animation: frostPulse 12s ease-in-out infinite;
      }

      @keyframes iceDrift1 {
        0%,
        100% {
          transform: translateY(0) rotate(0.1deg) scaleX(1);
        }
        25% {
          transform: translateY(-6px) rotate(0.3deg) scaleX(1.003);
        }
        50% {
          transform: translateY(-3px) rotate(-0.1deg) scaleX(0.998);
        }
        75% {
          transform: translateY(-8px) rotate(0.2deg) scaleX(1.004);
        }
      }
      @keyframes iceDrift2 {
        0%,
        100% {
          transform: translateY(0) rotate(-0.15deg);
        }
        33% {
          transform: translateY(-4px) rotate(0.1deg);
        }
        66% {
          transform: translateY(-7px) rotate(-0.25deg);
        }
      }
      @keyframes iceDrift3 {
        0%,
        100% {
          transform: translateY(0) rotate(0.2deg) scaleX(1);
        }
        50% {
          transform: translateY(-5px) rotate(-0.3deg) scaleX(1.002);
        }
      }
      @keyframes iceDrift4 {
        0%,
        100% {
          transform: translateY(0) rotate(-0.1deg);
        }
        25% {
          transform: translateY(-3px) rotate(0.15deg);
        }
        75% {
          transform: translateY(-6px) rotate(-0.2deg);
        }
      }
      @keyframes iceDrift5 {
        0%,
        100% {
          transform: translateY(0) rotate(0.05deg);
        }
        50% {
          transform: translateY(-4px) rotate(-0.1deg);
        }
      }
      @keyframes frostPulse {
        0%,
        100% {
          opacity: 0.85;
        }
        50% {
          opacity: 1;
        }
      }

      /* ── 阳光系统 ── */
      .sun-source {
        position: absolute;
        width: 380px;
        height: 380px;
        top: -8%;
        left: 55%;
        background: radial-gradient(
          circle,
          rgba(255, 240, 210, 0.55) 0%,
          rgba(255, 225, 170, 0.35) 15%,
          rgba(255, 210, 140, 0.18) 30%,
          rgba(255, 195, 110, 0.06) 50%,
          transparent 70%
        );
        border-radius: 50%;
        filter: blur(8px);
        animation: sunBreathe 8s ease-in-out infinite;
        pointer-events: none;
      }

      .sun-glow {
        position: absolute;
        width: 600px;
        height: 600px;
        top: -25%;
        left: 42%;
        background: radial-gradient(
          circle,
          rgba(255, 245, 220, 0.2) 0%,
          rgba(255, 230, 180, 0.1) 20%,
          rgba(255, 210, 140, 0.04) 40%,
          transparent 60%
        );
        border-radius: 50%;
        filter: blur(20px);
        animation: sunBreathe 8s ease-in-out 1s infinite;
        pointer-events: none;
      }

      @keyframes sunBreathe {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.9;
        }
        50% {
          transform: scale(1.08);
          opacity: 1;
        }
      }

      /* 光线 */
      .light-rays {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .ray {
        position: absolute;
        top: 5%;
        left: 62%;
        width: 3px;
        background: linear-gradient(
          180deg,
          rgba(255, 240, 200, 0.22) 0%,
          rgba(255, 220, 160, 0.1) 40%,
          transparent 100%
        );
        transform-origin: top center;
        filter: blur(1px);
        animation: rayShimmer var(--dur) ease-in-out infinite;
        animation-delay: var(--delay);
      }
      @keyframes rayShimmer {
        0%,
        100% {
          opacity: 0.3;
          transform: rotate(var(--angle)) scaleY(1);
        }
        50% {
          opacity: 0.7;
          transform: rotate(var(--angle)) scaleY(1.04);
        }
      }

      /* ── 粒子画布 ── */
      #particleCanvas {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
      }

      /* ── 主界面 ── */
      .app {
        position: relative;
        z-index: 10;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        pointer-events: none;
      }
      .app > * {
        pointer-events: auto;
      }

      /* 顶栏 */
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 28px;
        background: linear-gradient(
          180deg,
          rgba(10, 25, 45, 0.55) 0%,
          rgba(10, 25, 45, 0.25) 100%
        );
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        transition:
          transform 0.5s cubic-bezier(0.22, 0.61, 0.36, 1),
          opacity 0.5s ease;
      }
      .header.hidden {
        transform: translateY(-100%);
        opacity: 0;
        pointer-events: none;
      }
      .header-title {
        font-size: 1.5rem;
        font-weight: 300;
        letter-spacing: 0.12em;
        color: #e0ecf8;
        text-shadow:
          0 0 30px rgba(200, 220, 250, 0.4),
          0 2px 4px rgba(0, 0, 0, 0.3);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .header-title .icon {
        font-size: 1.6rem;
        filter: drop-shadow(0 0 8px rgba(180, 210, 240, 0.6));
      }
      .header-actions {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      /* 按钮 */
      .btn {
        padding: 8px 18px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.07);
        color: #d0e0f0;
        font-size: 0.85rem;
        font-family: inherit;
        cursor: pointer;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        transition: all 0.3s ease;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }
      .btn:hover {
        background: rgba(255, 255, 255, 0.15);
        border-color: rgba(255, 255, 255, 0.3);
        box-shadow: 0 0 20px rgba(180, 210, 240, 0.2);
        color: #f0f8ff;
      }
      .btn.active {
        background: rgba(240, 200, 100, 0.2);
        border-color: rgba(240, 200, 100, 0.5);
        color: #f8d56e;
        box-shadow: 0 0 16px rgba(240, 200, 100, 0.25);
      }

      /* ── 弹幕容器 ── */
      .danmaku-container {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: default;
      }
      .danmaku-container.paused .danmaku-item {
        animation-play-state: paused !important;
      }

      /* 弹幕项 */
      .danmaku-item {
        position: absolute;
        white-space: nowrap;
        padding: 8px 22px;
        border-radius: 22px;
        font-size: 0.95rem;
        letter-spacing: 0.05em;
        color: #e8f2fa;
        background: rgba(20, 40, 70, 0.45);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        border: 1px solid rgba(180, 210, 240, 0.18);
        box-shadow:
          0 2px 12px rgba(0, 0, 0, 0.2),
          0 0 20px rgba(150, 200, 240, 0.06) inset;
        animation: danmakuScroll var(--speed) linear infinite;
        animation-delay: var(--delay);
        cursor: pointer;
        transition:
          background 0.3s,
          border-color 0.3s,
          box-shadow 0.3s;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
        pointer-events: auto;
      }
      .danmaku-item:hover {
        background: rgba(40, 70, 110, 0.7);
        border-color: rgba(220, 240, 255, 0.5);
        box-shadow:
          0 4px 20px rgba(0, 0, 0, 0.3),
          0 0 30px rgba(180, 220, 250, 0.2) inset;
        z-index: 100 !important;
      }
      .danmaku-item.editing {
        background: rgba(30, 50, 80, 0.85);
        border-color: rgba(240, 200, 100, 0.6);
        box-shadow: 0 0 30px rgba(240, 200, 100, 0.3);
        z-index: 200 !important;
      }
      .danmaku-item.editing input {
        background: transparent;
        border: none;
        outline: none;
        color: #f8e8c0;
        font-family: inherit;
        font-size: inherit;
        letter-spacing: inherit;
        width: auto;
        min-width: 120px;
      }

      @keyframes danmakuScroll {
        0% {
          transform: translateX(105vw);
        }
        100% {
          transform: translateX(-120%);
        }
      }

      /* ── 控制面板 ── */
      .controls-bar {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 10px 24px;
        background: rgba(10, 22, 40, 0.5);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        flex-wrap: wrap;
        justify-content: center;
        transition:
          transform 0.5s cubic-bezier(0.22, 0.61, 0.36, 1),
          opacity 0.5s ease;
      }
      .controls-bar.hidden {
        transform: translateY(100%);
        opacity: 0;
        pointer-events: none;
      }
      .ctrl-group {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #b0c8e0;
        font-size: 0.8rem;
      }
      .ctrl-group label {
        white-space: nowrap;
        letter-spacing: 0.03em;
        opacity: 0.8;
      }
      .ctrl-group input[type="range"] {
        width: 70px;
        accent-color: #f0c060;
        height: 4px;
      }
      .ctrl-divider {
        width: 1px;
        height: 16px;
        background: rgba(255, 255, 255, 0.1);
        margin: 0 4px;
      }

      /* ── 留言板侧栏 ── */
      .message-panel {
        position: fixed;
        right: 0;
        top: 0;
        bottom: 0;
        width: 380px;
        max-width: 92vw;
        z-index: 50;
        background: rgba(10, 20, 38, 0.72);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border-left: 1px solid rgba(180, 210, 240, 0.15);
        box-shadow: -8px 0 40px rgba(0, 0, 0, 0.4);
        display: flex;
        flex-direction: column;
        transform: translateX(100%);
        transition: transform 0.45s cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      .message-panel.open {
        transform: translateX(0);
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 22px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.03);
      }
      .panel-header h3 {
        font-weight: 300;
        font-size: 1.15rem;
        letter-spacing: 0.08em;
        color: #d8e8f8;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .panel-close {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.05);
        color: #c0d4e8;
        cursor: pointer;
        font-size: 1.1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s;
      }
      .panel-close:hover {
        background: rgba(255, 255, 255, 0.15);
        border-color: rgba(255, 255, 255, 0.3);
      }

      .panel-messages {
        flex: 1;
        overflow-y: auto;
        padding: 14px 18px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .panel-messages::-webkit-scrollbar {
        width: 4px;
      }
      .panel-messages::-webkit-scrollbar-track {
        background: transparent;
      }
      .panel-messages::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.12);
        border-radius: 4px;
      }

      .msg-card {
        padding: 14px 18px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: #c8dcee;
        font-size: 0.9rem;
        line-height: 1.6;
        letter-spacing: 0.03em;
        transition: all 0.3s;
        position: relative;
        word-break: break-word;
      }
      .msg-card:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.18);
      }
      .msg-card .msg-time {
        font-size: 0.7rem;
        color: rgba(180, 200, 220, 0.5);
        margin-top: 6px;
        letter-spacing: 0.05em;
      }
      .msg-card .msg-delete {
        position: absolute;
        top: 8px;
        right: 12px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: none;
        background: rgba(255, 100, 100, 0.15);
        color: rgba(255, 180, 180, 0.7);
        cursor: pointer;
        font-size: 0.7rem;
        opacity: 0;
        transition: opacity 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .msg-card:hover .msg-delete {
        opacity: 1;
      }
      .msg-delete:hover {
        background: rgba(255, 100, 100, 0.35);
      }

      .panel-input-area {
        padding: 14px 18px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        gap: 8px;
      }
      .panel-input-area input {
        flex: 1;
        padding: 10px 16px;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.06);
        color: #e0eef8;
        font-family: inherit;
        font-size: 0.85rem;
        letter-spacing: 0.03em;
        outline: none;
        transition: all 0.3s;
      }
      .panel-input-area input:focus {
        border-color: rgba(240, 200, 100, 0.5);
        box-shadow: 0 0 14px rgba(240, 200, 100, 0.12);
        background: rgba(255, 255, 255, 0.1);
      }
      .panel-input-area input::placeholder {
        color: rgba(180, 200, 220, 0.35);
      }
      .btn-send {
        padding: 10px 20px;
        border-radius: 20px;
        border: 1px solid rgba(240, 200, 100, 0.35);
        background: rgba(240, 200, 100, 0.12);
        color: #f0d880;
        cursor: pointer;
        font-family: inherit;
        font-size: 0.85rem;
        letter-spacing: 0.04em;
        transition: all 0.3s;
        white-space: nowrap;
      }
      .btn-send:hover {
        background: rgba(240, 200, 100, 0.25);
        border-color: rgba(240, 200, 100, 0.6);
        box-shadow: 0 0 18px rgba(240, 200, 100, 0.2);
      }

      /* 留言板开关按钮 */
      .board-toggle {
        position: fixed;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        z-index: 55;
        width: 40px;
        height: 100px;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(10, 20, 38, 0.55);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        color: #c8dce8;
        cursor: pointer;
        font-size: 0.75rem;
        writing-mode: vertical-rl;
        letter-spacing: 0.15em;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.4s;
        box-shadow: -2px 0 20px rgba(0, 0, 0, 0.2);
      }
      .board-toggle:hover {
        background: rgba(20, 40, 70, 0.7);
        border-color: rgba(255, 255, 255, 0.3);
        box-shadow: -4px 0 30px rgba(0, 0, 0, 0.3);
      }
      .board-toggle.shifted {
        right: 396px;
      }

      /* ── 界面显隐开关（左下角） ── */
      .chrome-toggle {
        position: fixed;
        left: 16px;
        bottom: 16px;
        z-index: 55;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(10, 20, 38, 0.45);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        color: #b8cce0;
        cursor: pointer;
        font-size: 0.85rem;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.35s ease;
        box-shadow: 2px 2px 16px rgba(0, 0, 0, 0.2);
        padding: 0;
        line-height: 1;
      }
      .chrome-toggle:hover {

        //  状态管理 (localStorage)

        function loadQuotes() {
          try {

            }

          return DEFAULT_MESSAGES.map((text, i) => ({

            text,
            time: new Date(
              Date.now() - (DEFAULT_MESSAGES.length - i) * 3600000,
            ).toISOString(),
          }));
        }

        const opacitySlider = document.getElementById("opacitySlider");

        let chromeHidden = false;

        // ═══════════════════════════════════
        //  界面显隐
        // ═══════════════════════════════════
        function toggleChrome() {
          chromeHidden = !chromeHidden;
          if (chromeHidden) {
            headerEl.classList.add("hidden");

            chromeToggle.title = "隐藏导航栏和设置栏";

        // ═══════════════════════════════════
        //  弹幕系统
        // ═══════════════════════════════════
        let danmakuItems = [];
        let danmakuPaused = false;
        let currentRange = "full";
        let speedMultiplier = 1;
        let density = 8;
        let itemOpacity = 0.85;
        let animationId = null;
        let lastSpawnTime = 0;

        function getDanmakuSpeed() {
          // base speed: 12s–22s, adjusted by multiplier
          const base = 14 + Math.random() * 10;
          return base / speedMultiplier;
        }

        function getVerticalPos(range) {
          const containerH =
            danmakuContainer.clientHeight || window.innerHeight * 0.7;
          const margin = 60; // top/bottom margin
          const usableH = containerH - margin * 2;

          let minY, maxY;
          switch (range) {
            case "top-half":
              minY = margin;
              maxY = margin + usableH * 0.45;
              break;
            case "middle":
              minY = margin + usableH * 0.2;
              maxY = margin + usableH * 0.65;
              break;
            case "bottom-half":
              minY = margin + usableH * 0.5;
              maxY = margin + usableH;
              break;
            case "full":
            default:
              minY = margin;
              maxY = margin + usableH;
              break;
          }
          return minY + Math.random() * (maxY - minY);
        }

        function createDanmakuItem(text, index) {
          const el = document.createElement("div");
          el.className = "danmaku-item";
          el.dataset.index = index;
          el.style.setProperty("--speed", getDanmakuSpeed() + "s");
          el.style.setProperty("--delay", Math.random() * -20 + "s");
          el.style.top = getVerticalPos(currentRange) + "px";
          el.style.opacity = itemOpacity;
          el.style.zIndex = Math.floor(Math.random() * 10);
          el.textContent = text;

          // 点击编辑
          el.addEventListener("click", (e) => {
            if (el.classList.contains("editing")) return;
            startEditDanmaku(el, index);
          });

          // 动画结束重新定位
          el.addEventListener("animationiteration", () => {
            if (!el.classList.contains("editing")) {
              el.style.top = getVerticalPos(currentRange) + "px";
              el.style.setProperty("--speed", getDanmakuSpeed() + "s");
            }
          });

          danmakuContainer.appendChild(el);
          return el;
        }

        function startEditDanmaku(el, index) {
          el.classList.add("editing");
          el.style.animationPlayState = "paused";
          const original = quotes[index];
          const input = document.createElement("input");
          input.value = original;
          input.style.width = Math.max(120, original.length * 16) + "px";
          el.textContent = "";
          el.appendChild(input);
          input.focus();
          input.select();

          const finish = (save) => {
            const newText = input.value.trim();
            el.classList.remove("editing");
            el.style.animationPlayState = danmakuPaused ? "paused" : "running";
            el.removeChild(input);
            if (save && newText && newText !== original) {
              quotes[index] = newText;
              saveQuotes(quotes);
              el.textContent = newText;
              showToast("✏️ 语录已更新");
            } else if (save && !newText) {
              // delete
              quotes.splice(index, 1);
              saveQuotes(quotes);
              el.remove();
              danmakuItems = danmakuItems.filter((d) => d !== el);
              rebuildDanmaku();
              showToast("🗑️ 语录已删除");
            } else {
              el.textContent = original;
            }
          };

          input.addEventListener("blur", () => finish(true));
          input.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              finish(true);
            }
            if (e.key === "Escape") {
              e.preventDefault();
              finish(false);
            }
          });
        }

        function rebuildDanmaku() {
          danmakuItems.forEach((el) => el.remove());
          danmakuItems = [];
          for (let i = 0; i < Math.min(density, quotes.length); i++) {
            const qi = i % quotes.length;
            const el = createDanmakuItem(quotes[qi], qi);
            danmakuItems.push(el);
          }
          // extra items to fill
          const extra = density - danmakuItems.length;
          for (let i = 0; i < extra; i++) {
            const qi = Math.floor(Math.random() * quotes.length);
            const el = createDanmakuItem(quotes[qi], qi);
            danmakuItems.push(el);
          }
        }

        function updateDanmakuPositions() {
          danmakuItems.forEach((el) => {
            if (!el.classList.contains("editing")) {
              el.style.top = getVerticalPos(currentRange) + "px";
            }
          });
        }

        function updateDanmakuSpeed() {
          danmakuItems.forEach((el) => {
            if (!el.classList.contains("editing")) {
              el.style.setProperty("--speed", getDanmakuSpeed() + "s");
            }
          });
        }

        function updateDanmakuOpacity() {
          danmakuItems.forEach((el) => {
            el.style.opacity = itemOpacity;
          });
        }

        function updateDanmakuDensity() {
          const target = density;
          while (danmakuItems.length > target) {
            const el = danmakuItems.pop();
            el.remove();
          }
          while (danmakuItems.length < target) {
            const qi = Math.floor(Math.random() * quotes.length);
            const el = createDanmakuItem(quotes[qi], qi);
            danmakuItems.push(el);
          }
        }

        // ═══════════════════════════════════
        //  控制事件
        // ═══════════════════════════════════
        btnPause.addEventListener("click", () => {
          danmakuPaused = !danmakuPaused;
          btnPause.textContent = danmakuPaused ? "▶️ 播放" : "⏯️ 暂停";
          if (danmakuPaused) {
            danmakuContainer.classList.add("paused");
          } else {
            danmakuContainer.classList.remove("paused");
          }
          showToast(danmakuPaused ? "⏸️ 弹幕已暂停" : "▶️ 弹幕已播放");
        });

        btnReset.addEventListener("click", () => {
          quotes = [...DEFAULT_QUOTES];
          saveQuotes(quotes);
          rebuildDanmaku();
          showToast("↻ 已恢复默认语录");
        });

        btnAddQuote.addEventListener("click", () => {
          const text = prompt("请输入新的语录：");
          if (text && text.trim()) {
            quotes.push(text.trim());
            saveQuotes(quotes);
            rebuildDanmaku();
            showToast("✅ 新语录已添加");
          }
        });

        document.querySelectorAll(".range-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            document
              .querySelectorAll(".range-btn")
              .forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");
            currentRange = btn.dataset.range;
            updateDanmakuPositions();
            showToast(`显示区域：${btn.textContent}`);
          });
        });

        speedSlider.addEventListener("input", () => {
          speedMultiplier = parseFloat(speedSlider.value);
          speedLabel.textContent = speedMultiplier.toFixed(1) + "×";
          updateDanmakuSpeed();
        });

        densitySlider.addEventListener("input", () => {
          density = parseInt(densitySlider.value);
          densityLabel.textContent = density;
          updateDanmakuDensity();
        });

        opacitySlider.addEventListener("input", () => {
          itemOpacity = parseFloat(opacitySlider.value);
          updateDanmakuOpacity();
        });

        // ═══════════════════════════════════
        //  留言板
        // ═══════════════════════════════════
        let panelOpen = false;

        function openPanel() {
          panelOpen = true;
          messagePanel.classList.add("open");
          boardToggle.classList.add("shifted");
          boardToggle.textContent = "收 起";
        }

        function closePanel() {
          panelOpen = false;
          messagePanel.classList.remove("open");
          boardToggle.classList.remove("shifted");
          boardToggle.textContent = "留 言 板";
        }

        boardToggle.addEventListener("click", () => {
          if (panelOpen) closePanel();
          else openPanel();
        });

        panelClose.addEventListener("click", closePanel);

        function formatTime(iso) {
          const d = new Date(iso);
          const now = new Date();
          const diff = now - d;
          if (diff < 60000) return "刚刚";
          if (diff < 3600000) return Math.floor(diff / 60000) + "分钟前";
          if (diff < 86400000) return Math.floor(diff / 3600000) + "小时前";
          const month = (d.getMonth() + 1).toString().padStart(2, "0");
          const day = d.getDate().toString().padStart(2, "0");
          return `${month}-${day} ${d.getHours().toString().padStart(2, "0")}:${d.getMinutes().toString().padStart(2, "0")}`;
        }

        function renderMessages() {
          panelMessages.innerHTML = "";
          messages
            .slice()
            .reverse()
            .forEach((msg, revIdx) => {
              const card = document.createElement("div");
              card.className = "msg-card";
              card.innerHTML = `
        ${msg.text}
        <div class="msg-time">${formatTime(msg.time)}</div>
        <button class="msg-delete" data-id="${msg.id}">✕</button>
      `;
              card
                .querySelector(".msg-delete")
                .addEventListener("click", (e) => {
                  e.stopPropagation();
                  deleteMessage(msg.id);
                });
              panelMessages.appendChild(card);
            });
        }

        function addMessage(text) {
          const msg = {
            id: Date.now(),
            text,
            time: new Date().toISOString(),
          };
          messages.push(msg);
          saveMessages(messages);
          renderMessages();
          showToast("💬 留言已发送");
        }

        function deleteMessage(id) {
          messages = messages.filter((m) => m.id !== id);
          saveMessages(messages);
          renderMessages();
          showToast("🗑️ 留言已删除");
        }

        btnSend.addEventListener("click", () => {
          const text = msgInput.value.trim();
          if (text) {
            addMessage(text);
            msgInput.value = "";
          }
        });

        msgInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            const text = msgInput.value.trim();
            if (text) {
              addMessage(text);
              msgInput.value = "";
            }
          }
        });

        // ═══════════════════════════════════
        //  Toast
        // ═══════════════════════════════════
        let toastTimer;
        function showToast(msg) {
          clearTimeout(toastTimer);
          toast.textContent = msg;
          toast.classList.add("show");
          toastTimer = setTimeout(() => {
            toast.classList.remove("show");
          }, 2200);
        }

        // ═══════════════════════════════════
        //  光线生成
        // ═══════════════════════════════════
        function createLightRays() {
          const container = document.getElementById("lightRays");
          const count = 18;
          for (let i = 0; i < count; i++) {
            const ray = document.createElement("div");
            ray.className = "ray";
            const angle = -55 + (i / count) * 70; // spread from -55 to 15 degrees
            const height = 250 + Math.random() * 500;
            ray.style.setProperty("--angle", angle + "deg");
            ray.style.setProperty("--dur", 4 + Math.random() * 5 + "s");
            ray.style.setProperty("--delay", Math.random() * 3 + "s");
            ray.style.height = height + "px";
            ray.style.opacity = 0.15 + Math.random() * 0.35;
            ray.style.width = 1.5 + Math.random() * 3 + "px";
            container.appendChild(ray);
          }
        }

        // ═══════════════════════════════════
        //  冰晶粒子 (Canvas)
        // ═══════════════════════════════════
        function initParticles() {
          const canvas = document.getElementById("particleCanvas");
          const ctx = canvas.getContext("2d");
          let W, H;
          const particles = [];
          const MAX = 60;

          function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
          }
          resize();
          window.addEventListener("resize", resize);

          class Particle {
            constructor() {
              this.reset(true);
            }
            reset(init) {
              this.x = Math.random() * W;
              this.y = init ? Math.random() * H : H + 20;
              this.size = 1 + Math.random() * 3.5;
              this.opacity = 0.1 + Math.random() * 0.5;
              this.speedY = 0.15 + Math.random() * 0.55;
              this.speedX = (Math.random() - 0.5) * 0.35;
              this.wobble = Math.random() * Math.PI * 2;
              this.wobbleSpeed = 0.005 + Math.random() * 0.015;
              this.wobbleAmp = 0.2 + Math.random() * 0.8;
              this.shape = Math.random() < 0.4 ? "hex" : "diamond";
            }
            update() {
              this.y -= this.speedY;
              this.x += this.speedX + Math.sin(this.wobble) * this.wobbleAmp;
              this.wobble += this.wobbleSpeed;
              if (this.y < -20 || this.x < -20 || this.x > W + 20) {
                this.reset(false);
              }
            }
            draw(ctx) {
              ctx.save();
              ctx.translate(this.x, this.y);
              ctx.globalAlpha = this.opacity;
              ctx.fillStyle = "#e8f4ff";
              ctx.shadowColor = "rgba(200,225,255,0.7)";
              ctx.shadowBlur = this.size * 2;

              if (this.shape === "hex") {
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                  const a = (Math.PI / 3) * i - Math.PI / 6;
                  const r = this.size * 1.2;
                  if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
                  else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
                }
                ctx.closePath();
                ctx.fill();
              } else {
                // diamond
                ctx.beginPath();
                const s = this.size;
                ctx.moveTo(0, -s * 1.5);
                ctx.lineTo(s, 0);
                ctx.lineTo(0, s * 1.5);
                ctx.lineTo(-s, 0);
                ctx.closePath();
                ctx.fill();
              }
              ctx.restore();
            }
          }

          for (let i = 0; i < MAX; i++) {
            particles.push(new Particle());
          }

          function animate() {
            ctx.clearRect(0, 0, W, H);
            particles.forEach((p) => {
              p.update();
              p.draw(ctx);
            });
            requestAnimationFrame(animate);
          }
          animate();
        }

        // ═══════════════════════════════════
        //  键盘快捷键
        // ═══════════════════════════════════
        window.addEventListener("keydown", (e) => {
          if (e.target.tagName === "INPUT") return; // 不拦截输入框
          switch (e.key.toLowerCase()) {
            case " ":
              e.preventDefault();
              btnPause.click();
              break;
            case "m":
              boardToggle.click();
              break;
            case "r":
              if (e.ctrlKey) break;
              btnReset.click();
              break;
            case "n":
              if (e.ctrlKey) break;
              btnAddQuote.click();
              break;
            case "h":
              toggleChrome();
              break;
          }
        });

        // ═══════════════════════════════════
        //  窗口大小变化处理
        // ═══════════════════════════════════
        window.addEventListener("resize", () => {
          updateDanmakuPositions();
        });

        // ═══════════════════════════════════
        //  启动
        // ═══════════════════════════════════
        function init() {
          createLightRays();
          initParticles();
          rebuildDanmaku();
          renderMessages();

          // 初始留言板状态
          closePanel();

          console.log(
            "%c❄️ 冰语流光 %c已就绪 %c✨",
            "font-size:1.2em;color:#a8d8ea;",
            "color:#d0e0f0;",
            "font-size:1.2em;",
          );
          console.log(
            "%c快捷键：空格=暂停 | M=留言板 | N=添加语录 | R=重置 | H=沉浸模式",
            "color:#b0c8e0;font-size:0.85em;",
          );
        }

        init();
      })();
    </script>
  </body>
</html>
