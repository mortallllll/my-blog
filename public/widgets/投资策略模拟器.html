<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投资策略模拟游戏</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #1a2a6c);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 800px;
            padding: 20px;
            text-align: center;
        }
        
        h1 {
            color: #1a2a6c;
            margin-bottom: 20px;
            font-size: 28px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        
        .game-info {
            background: linear-gradient(to right, #e6f7ff, #fff0f0);
            border-radius: 15px;
            padding: 15px;
            margin: 15px 0;
            border: 2px solid #1a2a6c;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
        }
        
        .info-item {
            margin: 8px;
            padding: 8px 15px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
            min-width: 120px;
        }
        
        .info-label {
            font-weight: bold;
            color: #1a2a6c;
            font-size: 14px;
        }
        
        .info-value {
            font-size: 20px;
            font-weight: bold;
            color: #b21f1f;
            margin-top: 3px;
        }
        
        .coin-container {
            margin: 20px 0;
            position: relative;
            height: 150px;
        }
        
        .coin {
            width: 120px;
            height: 120px;
            margin: 0 auto;
            border-radius: 50%;
            background: linear-gradient(145deg, #d1d1d1, #ffffff);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            font-weight: bold;
            color: #333;
            border: 6px solid #ffd700;
            position: relative;
            transition: transform 0.5s ease;
        }
        
        .coin::before {
            content: "";
            position: absolute;
            top: -8px;
            left: -8px;
            right: -8px;
            bottom: -8px;
            border-radius: 50%;
            border: 2px solid rgba(255, 215, 0, 0.5);
            z-index: -1;
        }
        
        .controls {
            margin: 20px 0;
        }
        
        .strategy-section, .settings-section {
            background-color: #f8f9fa;
            border-radius: 15px;
            padding: 15px;
            margin: 15px 0;
            text-align: left;
            border: 1px solid #dee2e6;
        }
        
        .section-title {
            color: #1a2a6c;
            margin-bottom: 12px;
            font-size: 18px;
            text-align: center;
            font-weight: bold;
        }
        
        .form-group {
            margin: 10px 0;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .form-group label {
            width: 160px;
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }
        
        .form-control {
            flex: 1;
            min-width: 100px;
            padding: 8px;
            border: 2px solid #1a2a6c;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        
        .btn {
            background: linear-gradient(to right, #1a2a6c, #b21f1f);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        .btn:active {
            transform: translateY(1px);
        }
        
        .btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .btn-secondary {
            background: linear-gradient(to right, #6c757d, #495057);
        }
        
        .result {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            min-height: 25px;
        }
        
        .win {
            background-color: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }
        
        .lose {
            background-color: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }
        
        .chart-container {
            height: 250px;
            margin: 20px 0;
            position: relative;
        }
        
        .instructions {
            background-color: #e9ecef;
            border-radius: 15px;
            padding: 15px;
            margin-top: 20px;
            text-align: left;
        }
        
        .instructions h3 {
            color: #1a2a6c;
            margin-bottom: 8px;
            text-align: center;
            font-size: 18px;
        }
        
        .instructions ul {
            padding-left: 20px;
        }
        
        .instructions li {
            margin: 6px 0;
            line-height: 1.4;
            font-size: 14px;
        }
        
        .game-over {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }
        
        .game-over.active {
            opacity: 1;
            pointer-events: all;
        }
        
        .game-over-content {
            background: white;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        
        .game-over h2 {
            color: #b21f1f;
            margin-bottom: 15px;
            font-size: 28px;
        }
        
        .final-balance {
            font-size: 24px;
            font-weight: bold;
            color: #1a2a6c;
            margin: 15px 0;
        }
        
        .restart-btn {
            background: linear-gradient(to right, #1a2a6c, #b21f1f);
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 15px;
        }
        
        .auto-play {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            font-size: 14px;
        }
        
        .auto-play input {
            width: 70px;
            padding: 6px;
            border: 2px solid #1a2a6c;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
        }
        
        @media (max-width: 600px) {
            .form-group label {
                width: 120px;
                font-size: 12px;
            }
            
            .info-item {
                min-width: 90px;
                padding: 6px 10px;
            }
            
            .info-label {
                font-size: 12px;
            }
            
            .info-value {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>投资策略模拟游戏</h1>
        
        <div class="game-info">
            <div class="info-item">
                <div class="info-label">当前资金</div>
                <div id="balance" class="info-value">$25.00</div>
            </div>
            <div class="info-item">
                <div class="info-label">游戏次数</div>
                <div id="games-played" class="info-value">0</div>
            </div>
            <div class="info-item">
                <div class="info-label">胜率</div>
                <div id="win-rate" class="info-value">0%</div>
            </div>
        </div>
        
        <div class="coin-container">
            <div class="coin" id="coin">?</div>
        </div>
        
        <div class="chart-container">
            <canvas id="balanceChart"></canvas>
        </div>
        
        <div class="strategy-section">
            <div class="section-title">投资策略设置</div>
            <div class="form-group">
                <label for="strategy-select">投资策略:</label>
                <select id="strategy-select" class="form-control">
                    <option value="fixed">固定金额</option>
                    <option value="percentage" selected>按资金百分比</option>
                </select>
            </div>
            
            <div id="fixed-amount-group" class="form-group" style="display: none;">
                <label for="fixed-amount">固定下注金额 ($):</label>
                <input type="number" id="fixed-amount" class="form-control" min="0.01" value="5" step="0.01">
            </div>
            
            <div id="percentage-group" class="form-group">
                <label for="percentage-amount">资金百分比 (%):</label>
                <input type="number" id="percentage-amount" class="form-control" min="0.1" max="100" value="30" step="0.1">
            </div>
        </div>
        
        <div class="settings-section">
            <div class="section-title">游戏参数设置</div>
            <div class="form-group">
                <label for="win-probability">获胜概率 (%):</label>
                <input type="number" id="win-probability" class="form-control" min="0" max="100" value="60" step="0.1">
            </div>
            <div class="form-group">
                <label for="payout-ratio">赔率 (倍数):</label>
                <input type="number" id="payout-ratio" class="form-control" min="0.1" value="1" step="0.1">
            </div>
        </div>
        
        <div class="controls">
            <div class="btn-group">
                <button id="flip-btn" class="btn">单次抛硬币</button>
                <button id="auto-play-btn" class="btn btn-secondary">自动游戏</button>
                <button id="export-btn" class="btn btn-secondary">导出数据</button>
                <button id="reset-btn" class="btn btn-secondary">重置游戏</button>
            </div>
            
            <div class="auto-play">
                <span>自动游戏次数:</span>
                <input type="number" id="auto-count" min="1" max="1000" value="10">
            </div>
        </div>
        
        <div id="result" class="result"></div>
        
        <div class="instructions">
            <h3>游戏说明</h3>
            <ul>
                <li>起始资金: $25</li>
                <li>支持两种投资策略：固定金额或按当前资金百分比投资</li>
                <li>可自定义获胜概率（默认60%）和赔率（默认1:1）</li>
                <li>实时显示资金变化折线图</li>
                <li>可导出完整历史数据为CSV文件</li>
                <li>当资金低于$0.01时游戏结束</li>
            </ul>
        </div>
    </div>
    
    <div class="game-over" id="game-over">
        <div class="game-over-content">
            <h2>游戏结束!</h2>
            <p>您的资金已耗尽。</p>
            <div class="final-balance">最终资金: <span id="final-balance">$0.00</span></div>
            <button class="restart-btn" id="restart-btn">重新开始游戏</button>
        </div>
    </div>

    <script>
        // 游戏状态
        let balance = 25;
        let gamesPlayed = 0;
        let wins = 0;
        let isAutoPlaying = false;
        let autoPlayInterval = null;
        
        // 历史数据
        let balanceHistory = [25];
        let gameHistory = [{
            gameNumber: 0,
            balance: 25,
            betAmount: 0,
            result: "初始资金",
            win: null
        }];
        
        // DOM元素
        const balanceEl = document.getElementById('balance');
        const gamesPlayedEl = document.getElementById('games-played');
        const winRateEl = document.getElementById('win-rate');
        const coinEl = document.getElementById('coin');
        const resultEl = document.getElementById('result');
        const gameOverEl = document.getElementById('game-over');
        const finalBalanceEl = document.getElementById('final-balance');
        
        // 策略相关元素
        const strategySelect = document.getElementById('strategy-select');
        const fixedAmountGroup = document.getElementById('fixed-amount-group');
        const percentageGroup = document.getElementById('percentage-group');
        const fixedAmountInput = document.getElementById('fixed-amount');
        const percentageAmountInput = document.getElementById('percentage-amount');
        
        // 游戏参数元素
        const winProbabilityInput = document.getElementById('win-probability');
        const payoutRatioInput = document.getElementById('payout-ratio');
        
        // 按钮元素
        const flipBtn = document.getElementById('flip-btn');
        const autoPlayBtn = document.getElementById('auto-play-btn');
        const exportBtn = document.getElementById('export-btn');
        const resetBtn = document.getElementById('reset-btn');
        const restartBtn = document.getElementById('restart-btn');
        const autoCountInput = document.getElementById('auto-count');
        
        // 图表
        let balanceChart = null;
        const ctx = document.getElementById('balanceChart').getContext('2d');
        
        // 初始化图表
        function initChart() {
            if (balanceChart) {
                balanceChart.destroy();
            }
            
            balanceChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [0],
                    datasets: [{
                        label: '资金 ($)',
                        data: [25],
                        borderColor: '#b21f1f',
                        backgroundColor: 'rgba(178, 31, 31, 0.1)',
                        borderWidth: 3,
                        pointRadius: 3,
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top'
                        },
                        tooltip: {
                            mode: 'index',
                            intersect: false
                        }
                    },
                    scales: {
                        x: {
                            title: {
                                display: true,
                                text: '游戏次数'
                            },
                            grid: {
                                color: 'rgba(0, 0, 0, 0.1)'
                            }
                        },
                        y: {
                            title: {
                                display: true,
                                text: '资金 ($)'
                            },
                            grid: {
                                color: 'rgba(0, 0, 0, 0.1)'
                            },
                            beginAtZero: false
                        }
                    },
                    animation: {
                        duration: 300
                    }
                }
            });
        }
        
        // 切换策略显示
        strategySelect.addEventListener('change', function() {
            if (this.value === 'fixed') {
                fixedAmountGroup.style.display = 'flex';
                percentageGroup.style.display = 'none';
            } else {
                fixedAmountGroup.style.display = 'none';
                percentageGroup.style.display = 'flex';
            }
        });
        
        // 更新UI
        function updateUI() {
            balanceEl.textContent = `$${balance.toFixed(2)}`;
            gamesPlayedEl.textContent = gamesPlayed;
            const winRate = gamesPlayed > 0 ? Math.round((wins / gamesPlayed) * 10000) / 100 : 0;
            winRateEl.textContent = `${winRate}%`;
            
            // 更新图表
            if (balanceChart) {
                balanceChart.data.labels.push(gamesPlayed);
                balanceChart.data.datasets[0].data.push(balance);
                balanceChart.update();
            }
            
            // 检查游戏是否结束
            if (balance < 0.01) {
                finalBalanceEl.textContent = `$${balance.toFixed(2)}`;
                gameOverEl.classList.add('active');
                flipBtn.disabled = true;
                autoPlayBtn.disabled = true;
            } else {
                flipBtn.disabled = false;
                autoPlayBtn.disabled = false;
            }
        }
        
        // 获取当前下注金额
        function getCurrentBet() {
            if (strategySelect.value === 'fixed') {
                const fixedAmount = parseFloat(fixedAmountInput.value);
                return Math.min(fixedAmount, balance);
            } else {
                const percentage = parseFloat(percentageAmountInput.value);
                const bet = (balance * percentage) / 100;
                return Math.min(bet, balance);
            }
        }
        
        // 抛硬币函数（根据设置的概率）
        function flipCoin() {
            const winProb = parseFloat(winProbabilityInput.value) / 100;
            return Math.random() < winProb;
        }
        
        // 执行单次游戏
        function playGame() {
            // 如果资金不足，结束游戏
            if (balance < 0.01) {
                gameOverEl.classList.add('active');
                return;
            }
            
            const betAmount = getCurrentBet();
            
            // 验证下注金额
            if (isNaN(betAmount) || betAmount <= 0) {
                resultEl.textContent = "请输入有效的下注金额！";
                resultEl.className = "result lose";
                return;
            }
            
            // 抛硬币
            const isWin = flipCoin();
            gamesPlayed++;
            
            // 获取赔率
            const payoutRatio = parseFloat(payoutRatioInput.value);
            
            // 记录之前余额
            const previousBalance = balance;
            
            // 更新结果
            if (isWin) {
                // 赢
                const winnings = betAmount * payoutRatio;
                balance += winnings;
                wins++;
                coinEl.textContent = "H"; // Heads
                resultEl.textContent = `赢了! +$${winnings.toFixed(2)}`;
                resultEl.className = "result win";
                
                // 记录历史
                gameHistory.push({
                    gameNumber: gamesPlayed,
                    balance: balance,
                    betAmount: betAmount,
                    result: `赢 +$${winnings.toFixed(2)}`,
                    win: true
                });
            } else {
                // 输
                balance -= betAmount;
                coinEl.textContent = "T"; // Tails
                resultEl.textContent = `输了! -$${betAmount.toFixed(2)}`;
                resultEl.className = "result lose";
                
                // 记录历史
                gameHistory.push({
                    gameNumber: gamesPlayed,
                    balance: balance,
                    betAmount: betAmount,
                    result: `输 -$${betAmount.toFixed(2)}`,
                    win: false
                });
            }
            
            // 添加硬币翻转动画
            coinEl.style.transform = "rotateY(1800deg)";
            setTimeout(() => {
                coinEl.style.transform = "rotateY(0deg)";
            }, 500);
            
            // 更新UI
            updateUI();
        }
        
        // 自动游戏
        function startAutoPlay() {
            if (isAutoPlaying) return;
            
            const count = parseInt(autoCountInput.value);
            if (isNaN(count) || count <= 0) {
                alert("请输入有效的自动游戏次数！");
                return;
            }
            
            isAutoPlaying = true;
            flipBtn.disabled = true;
            autoPlayBtn.textContent = "停止自动游戏";
            
            let gamesPlayedInAuto = 0;
            autoPlayInterval = setInterval(() => {
                if (gamesPlayedInAuto >= count || balance < 0.01) {
                    stopAutoPlay();
                    return;
                }
                
                playGame();
                gamesPlayedInAuto++;
            }, 100); // 每100毫秒进行一次游戏
        }
        
        // 停止自动游戏
        function stopAutoPlay() {
            if (autoPlayInterval) {
                clearInterval(autoPlayInterval);
                autoPlayInterval = null;
            }
            isAutoPlaying = false;
            flipBtn.disabled = false;
            autoPlayBtn.textContent = "自动游戏";
        }
        
        // 导出历史数据
        function exportData() {
            if (gameHistory.length <= 1) {
                alert("没有游戏数据可导出！");
                return;
            }
            
            // 创建CSV内容
            let csvContent = "游戏次数,资金($),下注金额($),结果,胜负\n";
            
            gameHistory.forEach(record => {
                if (record.gameNumber === 0) return; // 跳过初始记录
                
                const winStatus = record.win === null ? "初始" : 
                                 record.win ? "赢" : "输";
                csvContent += `${record.gameNumber},${record.balance.toFixed(2)},${record.betAmount.toFixed(2)},"${record.result}",${winStatus}\n`;
            });
            
            // 创建下载链接
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", "investment_simulation_data.csv");
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
        
        // 重新开始游戏
        function restartGame() {
            balance = 25;
            gamesPlayed = 0;
            wins = 0;
            balanceHistory = [25];
            gameHistory = [{
                gameNumber: 0,
                balance: 25,
                betAmount: 0,
                result: "初始资金",
                win: null
            }];
            coinEl.textContent = "?";
            resultEl.textContent = "";
            resultEl.className = "result";
            gameOverEl.classList.remove('active');
            initChart();
            updateUI();
        }
        
        // 重置游戏设置
        function resetGame() {
            // 重置为默认值
            strategySelect.value = 'percentage';
            fixedAmountInput.value = '5';
            percentageAmountInput.value = '30';
            winProbabilityInput.value = '60';
            payoutRatioInput.value = '1';
            autoCountInput.value = '10';
            
            // 显示正确的策略设置
            fixedAmountGroup.style.display = 'none';
            percentageGroup.style.display = 'flex';
            
            restartGame();
        }
        
        // 事件监听
        flipBtn.addEventListener('click', playGame);
        autoPlayBtn.addEventListener('click', () => {
            if (isAutoPlaying) {
                stopAutoPlay();
            } else {
                startAutoPlay();
            }
        });
        exportBtn.addEventListener('click', exportData);
        resetBtn.addEventListener('click', resetGame);
        restartBtn.addEventListener('click', restartGame);
        
        // 初始化
        initChart();
        updateUI();
    </script>
</body>
</html>
