<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>哥德巴赫猜想验证器 - 超大数优化版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            animation: slideIn 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: 600;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            text-align: center;
            margin: 20px 0;
            height: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .loading.active {
            opacity: 1;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .result-item {
            background: #f8f9fa;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            opacity: 0;
            transform: translateX(-20px);
            animation: fadeInSlide 0.3s forwards;
        }

        @keyframes fadeInSlide {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .result-item:nth-child(2n) {
            background: #eef2f7;
            border-left-color: #764ba2;
        }

        .summary {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .error {
            color: #e74c3c;
            text-align: center;
            margin: 10px 0;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .error.show {
            opacity: 1;
        }

        .progress-info {
            text-align: center;
            margin: 10px 0;
            color: #667eea;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .progress-info.show {
            opacity: 1;
        }

        /* 滚动条样式 */
        .results::-webkit-scrollbar {
            width: 6px;
        }

        .results::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 3px;
        }

        .results::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 3px;
        }

        .results::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }

        /* 响应式设计 */
        @media (max-width: 480px) {
            .container {
                padding: 25px;
            }
            
            .input-group {
                flex-direction: column;
            }
            
            button {
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>哥德巴赫猜想验证器</h1>
        <div class="subtitle">支持超大数验证 · 只计算前10个解</div>
        <div class="input-group">
            <input type="text" id="numberInput" placeholder="请输入大于6的偶数（支持超大数）" autocomplete="off">
            <button id="verifyBtn">验证</button>
        </div>
        <div class="error" id="errorMessage"></div>
        <div class="progress-info" id="progressInfo"></div>
        <div class="loading" id="loading">
            <div class="spinner"></div>
        </div>
        <div class="results" id="results"></div>
        <div class="summary" id="summary"></div>
    </div>

    <script>
        // Miller-Rabin 概率性质数测试
        function millerRabin(n, k = 5) {
            if (n < 2) return false;
            if (n === 2 || n === 3) return true;
            if (n % 2 === 0) return false;
            
            // 将 n-1 写成 d * 2^r 的形式
            let r = 0;
            let d = n - 1;
            while (d % 2 === 0) {
                d /= 2;
                r++;
            }
            
            // 进行 k 轮测试
            for (let i = 0; i < k; i++) {
                const a = 2 + Math.floor(Math.random() * (n - 4));
                let x = modPow(a, d, n);
                
                if (x === 1 || x === n - 1) continue;
                
                let composite = true;
                for (let j = 0; j < r - 1; j++) {
                    x = modMul(x, x, n);
                    if (x === n - 1) {
                        composite = false;
                        break;
                    }
                }
                
                if (composite) return false;
            }
            
            return true;
        }
        
        // 模幂运算 (base^exp) % mod
        function modPow(base, exp, mod) {
            if (mod === 1) return 0;
            let result = 1;
            base = base % mod;
            while (exp > 0) {
                if (exp % 2 === 1) {
                    result = modMul(result, base, mod);
                }
                exp = Math.floor(exp / 2);
                base = modMul(base, base, mod);
            }
            return result;
        }
        
        // 安全的模乘法，防止溢出
        function modMul(a, b, mod) {
            // 对于 JavaScript 的 Number 类型，最大安全整数是 2^53 - 1
            // 如果乘积可能超过这个值，我们需要使用分治或其他方法
            if (a === 0 || b === 0) return 0;
            
            // 检查是否会溢出
            if (a > Number.MAX_SAFE_INTEGER / b) {
                // 使用俄罗斯农民乘法（二进制乘法）
                let result = 0;
                a = a % mod;
                while (b > 0) {
                    if (b % 2 === 1) {
                        result = (result + a) % mod;
                    }
                    a = (a * 2) % mod;
                    b = Math.floor(b / 2);
                }
                return result;
            }
            
            return (a * b) % mod;
        }
        
        // 简单的确定性质数检测（用于小数）
        function isPrimeSimple(n) {
            if (n <= 1) return false;
            if (n <= 3) return true;
            if (n % 2 === 0 || n % 3 === 0) return false;
            
            let i = 5;
            while (i * i <= n) {
                if (n % i === 0 || n % (i + 2) === 0) return false;
                i += 6;
            }
            return true;
        }
        
        // 智能质数检测：小数用确定性，大数用概率性
        function isPrime(n) {
            if (n < 1e12) {
                return isPrimeSimple(n);
            } else {
                return millerRabin(n);
            }
        }
        
        // 生成小质数列表（用于快速开始）
        function getSmallPrimes(limit = 1000) {
            const primes = [];
            const sieve = new Array(limit + 1).fill(true);
            sieve[0] = sieve[1] = false;
            
            for (let i = 2; i <= limit; i++) {
                if (sieve[i]) {
                    primes.push(i);
                    for (let j = i * i; j <= limit; j += i) {
                        sieve[j] = false;
                    }
                }
            }
            return primes;
        }
        
        // 超大数哥德巴赫验证（只找前maxResults个解）
        async function verifyGoldbachLarge(n, maxResults = 10) {
            const results = [];
            const smallPrimes = getSmallPrimes(10000); // 预计算小质数
            
            // 首先尝试小质数
            for (const prime of smallPrimes) {
                if (prime >= n) break;
                const complement = n - prime;
                if (complement < 2) break;
                
                if (isPrime(complement)) {
                    results.push([prime, complement]);
                    if (results.length >= maxResults) {
                        return results;
                    }
                }
                
                // 让出控制权，避免阻塞UI
                if (results.length % 2 === 0) {
                    await new Promise(resolve => setTimeout(resolve, 0));
                }
            }
            
            // 如果小质数不够，继续从大质数开始找
            let candidate = smallPrimes[smallPrimes.length - 1] + 1;
            const startTime = Date.now();
            const timeout = 10000; // 10秒超时
            
            while (results.length < maxResults && candidate < n / 2) {
                if (isPrime(candidate)) {
                    const complement = n - candidate;
                    if (isPrime(complement)) {
                        results.push([candidate, complement]);
                    }
                }
                
                candidate++;
                
                // 超时保护
                if (Date.now() - startTime > timeout) {
                    console.log('计算超时，返回已找到的结果');
                    break;
                }
                
                // 定期让出控制权
                if (candidate % 100 === 0) {
                    await new Promise(resolve => setTimeout(resolve, 0));
                }
            }
            
            return results;
        }
        
        // 主验证函数
        async function verifyGoldbach(n, maxResults = 10) {
            if (n <= 6 || n % 2 !== 0) {
                return null;
            }
            
            // 对于超大数，直接使用优化算法
            return await verifyGoldbachLarge(n, maxResults);
        }
        
        // 显示结果
        function displayResults(results, number) {
            const resultsDiv = document.getElementById('results');
            const summaryDiv = document.getElementById('summary');
            resultsDiv.innerHTML = '';
            
            if (!results || results.length === 0) {
                resultsDiv.innerHTML = '<div class="result-item">未找到有效的质数组合</div>';
                summaryDiv.textContent = '';
                return;
            }
            
            results.forEach((pair, index) => {
                setTimeout(() => {
                    const resultItem = document.createElement('div');
                    resultItem.className = 'result-item';
                    resultItem.textContent = `${formatNumber(number)} = ${formatNumber(pair[0])} + ${formatNumber(pair[1])}`;
                    resultsDiv.appendChild(resultItem);
                }, Math.min(index * 50, 200));
            });
            
            summaryDiv.textContent = `找到 ${results.length} 种分解方式`;
        }
        
        // 格式化大数显示
        function formatNumber(num) {
            if (typeof num === 'number') {
                if (num > 1e15) {
                    return num.toExponential(6);
                }
                return num.toLocaleString();
            }
            return num.toString();
        }
        
        // 显示错误信息
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            setTimeout(() => {
                errorDiv.classList.remove('show');
            }, 5000);
        }
        
        // 显示进度信息
        function showProgress(message) {
            const progressDiv = document.getElementById('progressInfo');
            progressDiv.textContent = message;
            progressDiv.classList.add('show');
        }
        
        function hideProgress() {
            const progressDiv = document.getElementById('progressInfo');
            progressDiv.classList.remove('show');
        }
        
        // 解析输入数字（支持科学计数法和大整数字符串）
        function parseInput(inputStr) {
            inputStr = inputStr.trim();
            
            // 检查是否为纯数字（包括科学计数法）
            if (/^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/.test(inputStr)) {
                const num = parseFloat(inputStr);
                if (!isNaN(num) && isFinite(num) && num > 0) {
                    return Math.floor(num);
                }
            }
            
            // 尝试解析大整数字符串
            if (/^\d+$/.test(inputStr)) {
                // JavaScript Number 最大安全整数是 2^53 - 1 ≈ 9e15
                if (inputStr.length <= 15) {
                    return parseInt(inputStr);
                } else {
                    // 对于超大数，我们只能用字符串处理，但质数检测会很困难
                    showError('数字过大，超出JavaScript安全整数范围');
                    return null;
                }
            }
            
            return null;
        }
        
        // 主要验证函数
        async function verify() {
            const input = document.getElementById('numberInput');
            const inputStr = input.value;
            const verifyBtn = document.getElementById('verifyBtn');
            const loadingDiv = document.getElementById('loading');
            
            // 解析输入
            const number = parseInput(inputStr);
            if (number === null) {
                showError('请输入有效的正整数');
                return;
            }
            
            if (number <= 6) {
                showError('请输入大于6的数字');
                return;
            }
            
            if (number % 2 !== 0) {
                showError('请输入偶数');
                return;
            }
            
            // 检查是否超出合理范围
            if (number > 1e16) {
                if (!confirm(`您输入的数字非常大 (${number.toExponential(2)})，计算可能需要较长时间。是否继续？`)) {
                    return;
                }
            }
            
            // 启用加载状态
            verifyBtn.disabled = true;
            loadingDiv.classList.add('active');
            hideProgress();
            document.getElementById('results').innerHTML = '';
            document.getElementById('summary').textContent = '';
            document.getElementById('errorMessage').classList.remove('show');
            
            try {
                showProgress('正在计算前10个解...');
                const results = await verifyGoldbach(number, 10);
                displayResults(results, number);
            } catch (error) {
                showError('计算过程中出现错误：' + error.message);
                console.error(error);
            } finally {
                verifyBtn.disabled = false;
                loadingDiv.classList.remove('active');
                hideProgress();
            }
        }
        
        // 事件监听器
        document.getElementById('verifyBtn').addEventListener('click', verify);
        
        // 支持回车键
        document.getElementById('numberInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                verify();
            }
        });
        
        // 初始焦点
        document.getElementById('numberInput').focus();
        
        // 示例：预填充一个大数用于测试
        // document.getElementById('numberInput').value = '14444444444444';
    </script>
</body>
</html>
